
name: Sync Public Reading Index

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write

concurrency:
  group: sakurai-public-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test index rules
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v

      - name: Build public reading index
        run: python scripts/sync_public_catalog.py

      - name: Commit public index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A -- data/public-index.json

          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public reading index'
            git push
          else
            echo 'Public reading index is unchanged.'
          fi
